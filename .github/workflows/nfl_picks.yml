name: Weekly NFL Picks

on:
  schedule:
    # Wednesday 13:00 UTC (~9 AM ET): full upcoming slate, ahead of Thursday Night Football.
    - cron: '0 13 * * 3'
    # Saturday 16:00 UTC (~12 PM ET): refresh after Friday injury designations, before the Sunday slate.
    - cron: '0 16 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predictions-push
  cancel-in-progress: false

jobs:
  generate-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Require REPO_ACCESS_TOKEN
        env:
          TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secrets.REPO_ACCESS_TOKEN is not set on this repository."
            echo "Create a fine-grained PAT with Contents:read on AmarRSehgal/nfl-prediction,"
            echo "then add it as the REPO_ACCESS_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Checkout NFL prediction repo
        uses: actions/checkout@v4
        with:
          repository: AmarRSehgal/nfl-prediction
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: nfl-prediction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: nfl-prediction/requirements.txt

      - name: Install dependencies
        run: pip install -r nfl-prediction/requirements.txt

      - name: Restore NFL database cache
        uses: actions/cache@v4
        with:
          path: nfl-prediction/data
          key: nfl-db-${{ github.run_number }}
          restore-keys: nfl-db-

      - name: Update data
        working-directory: nfl-prediction
        run: python3 weekly_update.py || echo "::warning::weekly_update.py failed; generating from cached data"

      - name: Generate picks
        working-directory: nfl-prediction
        # Contract: writes the predictions/nfl.json schema documented in predictions/README.md
        run: python3 generate_web_picks.py --output "$GITHUB_WORKSPACE/nfl.candidate.json"

      - name: Validate payload
        run: python3 .github/scripts/validate_predictions.py nfl nfl.candidate.json

      - name: Promote and commit
        run: |
          mv nfl.candidate.json predictions/nfl.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/nfl.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update NFL picks for $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
