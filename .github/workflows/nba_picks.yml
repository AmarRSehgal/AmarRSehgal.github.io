name: Daily NBA Picks

on:
  schedule:
    # 15:00 UTC daily = 10:00 ET in winter (EST) / 11:00 ET in summer (EDT).
    # NBA season is almost entirely EST, so this lands at 10 AM ET in-season.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Three prediction workflows push to main; serialise them so they cannot race.
concurrency:
  group: predictions-push
  cancel-in-progress: false

jobs:
  generate-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Require REPO_ACCESS_TOKEN
        env:
          TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secrets.REPO_ACCESS_TOKEN is not set on this repository."
            echo "Create a fine-grained PAT with Contents:read on AmarRSehgal/nba-prediction,"
            echo "then add it as the REPO_ACCESS_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Checkout NBA prediction repo
        uses: actions/checkout@v4
        with:
          repository: AmarRSehgal/nba-prediction
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: nba-prediction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: nba-prediction/requirements.txt

      - name: Install dependencies
        run: pip install -r nba-prediction/requirements.txt

      - name: Restore NBA database cache
        uses: actions/cache@v4
        with:
          path: nba-prediction/data
          key: nba-db-${{ github.run_number }}
          restore-keys: nba-db-

      - name: Update data
        id: update
        working-directory: nba-prediction
        run: python3 daily_update.py || echo "::warning::daily_update.py failed; generating from cached data"

      - name: Generate picks
        working-directory: nba-prediction
        # Writes to a staging path so a bad run cannot clobber the published file.
        run: python3 generate_web_picks.py --output "$GITHUB_WORKSPACE/nba.candidate.json"

      - name: Validate payload
        run: python3 .github/scripts/validate_predictions.py nba nba.candidate.json

      - name: Promote and commit
        run: |
          mv nba.candidate.json predictions/nba.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/nba.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update NBA picks for $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
