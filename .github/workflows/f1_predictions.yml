name: F1 Race Predictions

on:
  schedule:
    # Thursday 12:00 UTC, ahead of the race weekend.
    - cron: '0 12 * * 4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predictions-push
  cancel-in-progress: false

jobs:
  generate-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Require REPO_ACCESS_TOKEN
        env:
          TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secrets.REPO_ACCESS_TOKEN is not set on this repository."
            echo "Create a fine-grained PAT with Contents:read on AmarRSehgal/f1_prediction,"
            echo "then add it as the REPO_ACCESS_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Checkout F1 prediction repo
        uses: actions/checkout@v4
        with:
          repository: AmarRSehgal/f1_prediction
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: f1-prediction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: f1-prediction/requirements.txt

      - name: Install dependencies
        run: pip install -r f1-prediction/requirements.txt

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: f1-prediction/f1_cache
          key: f1-cache-${{ github.run_number }}
          restore-keys: f1-cache-

      - name: Generate predictions
        working-directory: f1-prediction
        run: python3 generate_web_predictions.py --output "$GITHUB_WORKSPACE/f1.candidate.json"

      - name: Validate payload
        run: python3 .github/scripts/validate_predictions.py f1 f1.candidate.json

      - name: Promote and commit
        run: |
          mv f1.candidate.json predictions/f1.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/f1.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update F1 predictions for $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
